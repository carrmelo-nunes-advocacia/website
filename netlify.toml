# Deploy config para Netlify (git-connected). Vite SPA: build para dist/, rotas
# resolvidas no cliente (react-router) → fallback para index.html.
[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# ---- Cabeçalhos de segurança (equivalente ao middleware do projeto Next) ----
# CSP sem nonce: Vite não emite scripts inline; Tailwind/framer usam style inline.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---- Redirects ----
# Migração do site antigo (WordPress/Elementor em carmelonunes.com.br) — sem efeito
# até o domínio apontar para a Netlify. Mapeado em 2026-08-26.
[[redirects]]
  from = "/quem-somos/"
  to = "/escritorio"
  status = 301
[[redirects]]
  from = "/socios/"
  to = "/escritorio"
  status = 301
[[redirects]]
  from = "/areas-de-atuacao/"
  to = "/atuacao"
  status = 301
[[redirects]]
  from = "/noticias/*"
  to = "/conteudo"
  status = 301
[[redirects]]
  from = "/contato/"
  to = "/contato"
  status = 301
# Posts lorem-ipsum de 2021 e rastros do WordPress
[[redirects]]
  from = "/2021/*"
  to = "/conteudo"
  status = 301
[[redirects]]
  from = "/wp-admin/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/wp-login.php"
  to = "/"
  status = 301
[[redirects]]
  from = "/wp-content/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/wp-json/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/xmlrpc.php"
  to = "/"
  status = 301
[[redirects]]
  from = "/feed/*"
  to = "/conteudo"
  status = 301
[[redirects]]
  from = "/comments/*"
  to = "/conteudo"
  status = 301
[[redirects]]
  from = "/category/*"
  to = "/conteudo"
  status = 301
[[redirects]]
  from = "/tag/*"
  to = "/conteudo"
  status = 301
[[redirects]]
  from = "/author/*"
  to = "/escritorio"
  status = 301
# Formulário estático usado só para detecção da Netlify Forms — não servir.
[[redirects]]
  from = "/__forms.html"
  to = "/404"
  status = 404
  force = true

# SPA fallback (deve ser o último).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
