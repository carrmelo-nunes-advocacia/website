name: Aviso de publicação

# Depois de cada merge na main, comenta no PR de origem com o link do que foi publicado.
# É o "monitor" para quem publica pela web: o aviso chega no PR e por e-mail do GitHub.

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  avisar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - name: Comentar no PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr=$(gh pr list --state merged --search "${{ github.sha }}" --json number --jq '.[0].number' 2>/dev/null || true)
          [ -n "$pr" ] || { echo "sem PR associado"; exit 0; }
          links=$(git diff --name-only HEAD~1 HEAD -- 'src/content/artigos/*.md' | grep -v '/_' | sed -E 's#src/content/artigos/(.*)\.md#- https://carmelonunes.com.br/conteudo/\1#')
          if [ -n "$links" ]; then
            body=$(printf '🚀 **Publicado.** Em ~1 minuto estará no ar:\n%s\n\n_(Se o domínio ainda não foi virado, troque por carmelonunes.netlify.app.)_' "$links")
          else
            body='🚀 **Publicado.** A alteração está no ar em https://carmelonunes.com.br (≈1 min).'
          fi
          gh pr comment "$pr" --body "$body"
