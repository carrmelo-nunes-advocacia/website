name: Prévia e pedido de OK

# Fluxo de publicação pela web (claude.ai/code):
# 1. PR aberto → este job classifica (só artigos? ou layout/outros?), espera CI + Lighthouse e a
#    prévia da Netlify, e comenta o link da prévia.
# 2. Só artigos → pergunta "Ficou bom? Responda **publicar**". O merge acontece na workflow
#    publicar-com-ok.yml quando a pessoa responder na página do PR.
#    Outros arquivos → revisão técnica (Pedro mescla).
# Nada é publicado sem o OK humano na prévia.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    name: auto-merge (artigos)
    if: github.actor != 'dependabot[bot]' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - name: Só artigos?
        id: scope
        run: |
          files=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json files --jq '.files[].path')
          echo "$files"
          ok=true
          while IFS= read -r f; do
            case "$f" in
              src/content/artigos/_*) ok=false ;;          # _template.md é técnico
              src/content/artigos/*.md) ;;
              public/sitemap.xml) ;;                       # gerado no build; inofensivo
              *) ok=false ;;
            esac
          done <<< "$files"
          [ -n "$files" ] || ok=false
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          links=$(printf '%s\n' "$files" | grep -E '^src/content/artigos/[^_].*\.md$' | sed -E 's#src/content/artigos/(.*)\.md#- https://carmelonunes.com.br/conteudo/\1#' || true)
          { echo "links<<EOF"; echo "$links"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Link de prévia (Netlify)
        id: preview
        run: |
          sha=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          url=""
          for i in $(seq 1 45); do
            url=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/statuses" --jq '.[] | select(.context|test("deploy-preview")) | select(.state=="success") | .target_url' 2>/dev/null | head -1)
            [ -n "$url" ] && break; sleep 20
          done
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [ -n "$url" ]; then
            if [ "${{ steps.scope.outputs.ok }}" = "true" ]; then
              gh pr comment "$PR_URL" --body "👀 **Prévia pronta:** $url — veja como ficou (no computador e no celular). Se estiver bom, **responda \`publicar\` aqui** e eu ponho no ar. Quer mudar algo? Peça na conversa do Claude; a prévia se atualiza sozinha."
            else
              gh pr comment "$PR_URL" --body "👀 **Prévia pronta:** $url — confira como ficou. Como esta mudança vai além de artigos, o Pedro revisa e aprova a publicação; você recebe o aviso aqui quando estiver no ar."
            fi
          fi

      - name: Fora do escopo
        if: steps.scope.outputs.ok != 'true'
        run: |
          gh pr comment "$PR_URL" --body "ℹ️ Esta mudança vai além de artigos (layout, textos de página, fotos…). Ela **não publica sozinha**: o Pedro revisa a prévia e aprova. Nada a fazer por aqui."

      - name: Avisar o que vai acontecer
        if: steps.scope.outputs.ok == 'true'
        run: |
          gh pr comment "$PR_URL" --body "✅ Só artigos alterados. Vou preparar uma **prévia** (~2 min) e as verificações (~5 min). Quando estiver tudo pronto, pergunto aqui se pode publicar."

      - name: Esperar CI e Lighthouse
        if: steps.scope.outputs.ok == 'true'
        run: |
          # Espera só os checks exigidos pela ruleset (ignora este próprio job e os da Netlify).
          for i in $(seq 1 90); do
            s=$(gh pr checks "$PR" --repo "$GITHUB_REPOSITORY" --json name,state 2>/dev/null || echo '[]')
            ci=$(echo "$s" | jq -r '.[] | select(.name=="lint · type-check · build") | .state')
            lh=$(echo "$s" | jq -r '.[] | select(.name=="lighthouse") | .state')
            echo "ci=$ci lighthouse=$lh"
            if [ "$ci" = "SUCCESS" ] && [ "$lh" = "SUCCESS" ]; then exit 0; fi
            case "$ci$lh" in *FAILURE*|*ERROR*|*CANCELLED*) echo "check falhou"; exit 1;; esac
            sleep 20
          done
          echo "timeout esperando checks"; exit 1

      - name: Verificações concluídas — aguardando OK
        if: steps.scope.outputs.ok == 'true'
        run: |
          gh pr comment "$PR_URL" --body "✔️ Verificações concluídas. Está tudo certo tecnicamente — só falta o seu **\`publicar\`** aqui para ir ao ar."

      - name: Aviso de falha
        if: failure() && steps.scope.outputs.ok == 'true'
        run: |
          gh pr comment "$PR_URL" --body "❌ Uma verificação falhou ou demorou demais; a publicação está pausada. O Pedro vai olhar — nada a fazer por aqui."
