name: Auto-merge de conteúdo

# Publicação "1 clique" para quem edita pela web (claude.ai/code): se o PR só toca
# artigos em src/content/artigos/, habilita o auto-merge do GitHub. O merge só acontece
# quando os checks obrigatórios da ruleset (CI + Lighthouse) ficarem verdes.
# Qualquer arquivo fora desse caminho → sem auto-merge → revisão técnica.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: auto-merge (artigos)
    if: github.actor != 'dependabot[bot]' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - name: Só artigos?
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json files --jq '.files[].path')
          echo "$files"
          ok=true
          while IFS= read -r f; do
            case "$f" in
              src/content/artigos/_*) ok=false ;;          # _template.md é técnico
              src/content/artigos/*.md) ;;
              *) ok=false ;;
            esac
          done <<< "$files"
          [ -n "$files" ] || ok=false
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
      - name: Habilitar auto-merge
        if: steps.scope.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
          gh pr comment "${{ github.event.pull_request.html_url }}" --body "✅ Só artigos alterados: publicação automática habilitada. Assim que os checks ficarem verdes, o artigo vai ao ar (≈2 min depois)."
      - name: Fora do escopo
        if: steps.scope.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.html_url }}" --body "ℹ️ Este PR altera arquivos fora de \`src/content/artigos/\`. Precisa de revisão técnica antes de publicar (sem auto-merge)."
